# Required secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY, DEPLOY_PATH
# First server setup: clone repo to DEPLOY_PATH, copy configs/.env.example to `.env`,
# edit secrets, then run configs/deploy-ec2.sh once to verify Docker.

name: Deploy to EC2

on:
  push:
    branches:
      - AK07

permissions:
  contents: read

concurrency:
  group: ak07-ec2-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin
            git checkout AK07
            git pull --ff-only origin AK07
            chmod +x configs/deploy-ec2.sh
            DEPLOY_BRANCH=AK07 configs/deploy-ec2.sh "${{ secrets.DEPLOY_PATH }}"
