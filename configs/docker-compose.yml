# Run from repository root:
#   docker compose -f configs/docker-compose.yml up -d --build
# Copy configs/.env.example to repo root as `.env` before first deploy.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - ak07_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ak07

  api:
    build:
      context: ..
      dockerfile: configs/docker/Dockerfile.api
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src/server/src
      DASHBOARD_RESTART_BOT_ON_SAVE: ${DASHBOARD_RESTART_BOT_ON_SAVE:-0}
      REDIS_HOST: redis
    volumes:
      - ak07_server_data:/app/src/server/data
    expose:
      - "8000"
    ports:
      - "8080:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - ak07

  engine:
    build:
      context: ..
      dockerfile: configs/docker/Dockerfile.api
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: ["python", "-u", "src/server/src/app/services/upstox_engine.py"]
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src/server/src
      REDIS_HOST: redis
    volumes:
      - ak07_server_data:/app/src/server/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ak07

  smc_crt_engine:
    build:
      context: ..
      dockerfile: configs/docker/Dockerfile.api
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: ["python", "-u", "src/server/src/app/services/smc_crt_engine.py"]
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src/server/src
      REDIS_HOST: redis
    volumes:
      - ak07_server_data:/app/src/server/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ak07

  breakout_engine:
    build:
      context: ..
      dockerfile: configs/docker/Dockerfile.api
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: ["python", "-u", "src/server/src/app/services/breakout_engine.py"]
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src/server/src
      REDIS_HOST: redis
      # S3 trading disabled — engine publishes BLR + day_review for S2 only
      BREAKOUT_ENTRIES_ENABLED: "0"
    volumes:
      - ak07_server_data:/app/src/server/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ak07

  s7_engine:
    build:
      context: ..
      dockerfile: configs/docker/Dockerfile.api
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: ["python", "-u", "src/server/src/app/services/s7_vwap_breakout_engine.py"]
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src/server/src
      REDIS_HOST: redis
    volumes:
      - ak07_server_data:/app/src/server/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ak07

  choch_engine:
    build:
      context: ..
      dockerfile: configs/docker/Dockerfile.api
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: ["python", "-u", "src/server/src/app/services/choch_engine.py"]
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src/server/src
      REDIS_HOST: redis
      CHOCH_MAX_LOTS: "2"
      CHOCH_RISK_PCT: "1.0"
      CHOCH_DAILY_LOSS_LIMIT_PCT: "2.0"
    volumes:
      - ak07_server_data:/app/src/server/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ak07

  gamma_expiry_engine:
    build:
      context: ..
      dockerfile: configs/docker/Dockerfile.api
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    command: ["python", "-u", "src/server/src/app/services/gamma_expiry_engine.py"]
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src/server/src
      REDIS_HOST: redis
      AK07_PAPER_TRADING: "1"
    volumes:
      - ak07_server_data:/app/src/server/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ak07

  mcp:
    build:
      context: ..
      dockerfile: configs/docker/Dockerfile.api
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    command: ["python", "-u", "src/server/src/mcp_server.py", "--host", "0.0.0.0", "--port", "8765"]
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src/server/src
      REDIS_HOST: redis
    ports:
      - "8765:8765"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ak07

  cockpit:
    build:
      context: ..
      dockerfile: configs/docker/Dockerfile.api
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    command: ["python", "-m", "streamlit", "run", "src/server/src/app/ui/dashboard.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    env_file:
      - ../.env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src/server/src
      REDIS_HOST: redis
      COMPOSE_FILE: /app/configs/docker-compose.yml
    volumes:
      - ak07_server_data:/app/src/server/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/app
    ports:
      - "8501:8501"
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_started
      smc_crt_engine:
        condition: service_started
      breakout_engine:
        condition: service_started
      s7_engine:
        condition: service_started
      choch_engine:
        condition: service_started
      gamma_expiry_engine:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/healthz', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - ak07

networks:
  ak07:
    driver: bridge

volumes:
  ak07_server_data:
  ak07_redis_data:
